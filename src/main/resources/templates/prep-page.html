<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <link rel="stylesheet" th:href="@{/assessment.css}" >
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="quiz-header">
    <div class="quiz-header-inner">
        <a href="#" class="quiz-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </span>
            <span class="brand-name">QuickPrep</span>
        </a>

        <span class="quiz-meta">
        Assessment &middot;
        <span th:text="${quiz.questions.size()}">10</span> Questions
      </span>
    </div>
</header>

<!-- ============ MAIN ============ -->
<main class="quiz-main">

    <div class="quiz-intro">
        <p class="eyebrow">TIMED PRACTICE</p>
        <h1>Answer every question, then submit</h1>
        <p class="quiz-intro-sub">Select one option per question. You can review your results after submitting.</p>
    </div>

    <form method="post" th:action="@{/submit}" class="quiz-form">

        <div class="question-list">

            <article class="question-card" th:each="question, qStat : ${quiz.questions}">

                <div class="question-card-head">
                    <span class="question-badge" th:text="${qStat.index + 1}">1</span>
                    <div class="question-head-text">
              <span class="question-label">
                Question <span th:text="${qStat.count}">1</span> of <span th:text="${quiz.questions.size()}">10</span>
              </span>
                        <h2 class="question-text" th:text="${question.question}">
                            Sample question text appears here?
                        </h2>
                    </div>
                </div>

                <div class="options-list">
                    <label class="option-row"
                           th:each="option, oStat : ${question.options}"
                           th:for="|q${qStat.index}_o${oStat.index}|">
                        <input type="radio"
                               class="option-input"
                               th:id="|q${qStat.index}_o${oStat.index}|"
                               th:name="|question${qStat.index}|"
                               th:value="${oStat.index}"
                               required>
                        <span class="option-marker" aria-hidden="true"></span>
                        <span class="option-letter" th:text="${oStat.count}">1</span>
                        <span class="option-text" th:text="${option}">Option text goes here</span>
                    </label>
                </div>

            </article>

        </div>

        <div class="submit-bar">
            <p class="submit-hint">Double-check your answers — submission is final.</p>
            <button type="submit" class="btn-submit">Submit Assessment</button>
        </div>

    </form>
</main>

</body>
</html>
